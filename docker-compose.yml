version: '3.8'

services:
  app:
    build: .
    container_name: modelsecurityda-nginx
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__SqlServer: Server=sqlserver-db,1433;Database=ModelSecurityDa;User Id=sa;Password=StrongPwd!123;Encrypt=True;TrustServerCertificate=True;Connection Timeout=60;
      ConnectionStrings__Postgres: Host=postgres-db;Port=5432;Database=modelsecurityda;Username=postgres;Password=StrongPwd!123;
      ConnectionStrings__MySql: Server=mysql-db;Port=3306;Database=modelsecurityda;User=mysqluser;Password=StrongPwd!123;
      JwtSettings__SecretKey: "mi-clave-secreta-super-segura-que-tiene-mas-de-256-bits-para-garantizar-la-seguridad"
      JwtSettings__Issuer: "ModelSecurityDa"
      JwtSettings__Audience: "ModelSecurityDaUsers"
    ports:
      - "8888:80"
      - "5001:5000"
    networks:
      - modelsecurity-network
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      postgres:
        condition: service_healthy
      # mysql:
      #   condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s


  # Servicio de SQL Server
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=StrongPwd!123
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    networks:
      - modelsecurity-network
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P StrongPwd!123 -C -Q 'SELECT 1'"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s

  # Servicio de PostgreSQL  
  postgres:
    image: postgres:16
    container_name: postgres-db
    environment:
      - POSTGRES_DB=modelsecurityda
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=StrongPwd!123
    ports:
      - "5432:5432"
    networks:
      - modelsecurity-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d modelsecurityda"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  # Servicio de MySQL
  mysql:
    image: mysql:8.4
    container_name: mysql-db
    environment:
      - MYSQL_DATABASE=modelsecurityda
      - MYSQL_USER=mysqluser
      - MYSQL_PASSWORD=StrongPwd!123
      - MYSQL_ROOT_PASSWORD=StrongPwd!123
    ports:
      - "3306:3306"
    networks:
      - modelsecurity-network
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -pStrongPwd!123"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  sqlserver_data:
  postgres_data:
  mysql_data:

networks:
  modelsecurity-network:
    driver: bridge