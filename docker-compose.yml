version: '3.8'

services:
  web-api:
    build: 
      context: .
      dockerfile: Web2/Dockerfile
    container_name: modelsecurityda
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=nombre-contenedor-bd,1433;Database=ModelSecurityDa;User Id=sa;Password=StrongPwd!123;Encrypt=True;TrustServerCertificate=True;Connection Timeout=60;
      # Variables para el script de migraciones
      - DB_SERVER=nombre-contenedor-bd
      - DB_NAME=ModelSecurityDa
      - DB_USER=sa
      - DB_PASSWORD=StrongPwd!123
    ports:
      - "5112:8080"
    networks:
      - nombre-de-tu-red-existente
    restart: unless-stopped
    depends_on:
      sql-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Servicio de SQL Server
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nombre-contenedor-bd
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=StrongPwd!123
      - MSSQL_PID=Express
    ports:
      - "1434:1433"  # Puerto diferente para evitar conflictos locales
    networks:
      - nombre-de-tu-red-existente
    volumes:
      - sql_data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P StrongPwd!123 -C -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  sql_data:

networks:
  nombre-de-tu-red-existente:
    external: false  # Cambiar a false para crear la red automáticamente